[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel1-level0-decoder-demo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "marimo",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "sentinel1decoder",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.marimo.runtime]
auto_instantiate = true
auto_reload = "lazy"
on_cell_change = "lazy"
watcher_on_save = "lazy"
